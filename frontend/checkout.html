<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Loja</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>

<body>
    <div class="checkout-container">
        <!-- =============================================== -->
        <!-- ============ INFORMAÇÕES DO CLIENTE =========== -->
        <!-- =============================================== -->
        <main class="customer-info">
            <!-- NOVO: Link/Botão para voltar -->
            <a href="/" class="close-checkout-btn" aria-label="Voltar à loja">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>

            <h1 class="main-logo"><a href="/">Logo</a></h1>
            

            <!-- Resumo do pedido para mobile (acordeão) -->
            <details class="order-summary-mobile">
                <summary class="order-summary-mobile__toggle">
                    <div class="flex-group">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Mostrar resumo do pedido</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <span class="order-summary-mobile__total-price">R$ 0,00</span>
                </summary>
                <div class="order-summary-mobile__content">
                    <!-- O resumo do pedido será inserido aqui pelo JS -->
                </div>
            </details>

            <form id="checkout-form" class="checkout-form">
                <section class="form-section">
                    <h2>Contato</h2>
                    <div class="form-group">
                        <label for="email">E-mail ou número de celular</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                </section>

                <section class="form-section">
                    <h2>Entrega</h2>
                    <div class="form-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" name="name" placeholder="Nome e Sobrenome" required>
                    </div>
                    <div class="form-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Endereço</label>
                        <input type="text" id="address" name="address" placeholder="Rua, Avenida..." required>
                    </div>
                    <div class="form-group-grid">
                        <div class="form-group">
                            <label for="number">Número</label>
                            <input type="text" id="number" name="number" required>
                        </div>
                        <div class="form-group">
                            <label for="complement">Complemento (opcional)</label>
                            <input type="text" id="complement" name="complement" placeholder="Apto, Bloco">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="neighborhood">Bairro</label>
                        <input type="text" id="neighborhood" name="neighborhood" required>
                    </div>
                    <div class="form-group-grid">
                        <div class="form-group">
                            <label for="city">Cidade</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="state">Estado</label>
                            <input type="text" id="state" name="state" required>
                        </div>
                    </div>
                </section>

                <button type="submit" class="btn-whatsapp-finish">
                    <i class="fab fa-whatsapp"></i>
                    Finalizar Pedido no WhatsApp
                </button>
            </form>
        </main>

        <!-- =============================================== -->
        <!-- ============= RESUMO DO PEDIDO ================ -->
        <!-- =============================================== -->
        <aside class="order-summary">
            <div class="order-summary__content">
                <!-- O resumo do pedido será inserido aqui pelo JS -->
            </div>
        </aside>
    </div>

    <!-- JS -->
     <script src="js/scripts.js"></script>
    <script src="js/checkout.js"></script>
    
</body>
</html>
