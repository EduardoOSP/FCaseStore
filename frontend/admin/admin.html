<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - FCaseStore</title>
    <!-- Ícones e Fontes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Admin -->
    <link rel="stylesheet" href="./admin.css">
</head>
<body>

    <!-- HEADER -->
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <h2><i class="fas fa-cog"></i> FCaseStore Admin</h2>
            </div>
            <nav class="main-nav">
                <button class="nav-btn active" onclick="switchTab('products')">
                    <i class="fas fa-box-open"></i> Produtos
                </button>
                <button class="nav-btn" onclick="switchTab('banners')">
                    <i class="fas fa-images"></i> Banners
                </button>
                <a href="/" target="_blank" class="nav-btn link-site">
                    <i class="fas fa-external-link-alt"></i> Ver Site
                </a>
                <button onclick="logout()" class="nav-btn" style="color:#ff8787; border:1px solid rgba(255,135,135,0.3)">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="admin-container">
        
        <!-- ABA PRODUTOS -->
        <section id="tab-products" class="tab-content active">
            <div class="section-header">
                <div>
                    <h1>Gerenciar Produtos</h1>
                    <p>Cadastre e edite os produtos da loja.</p>
                </div>
                <button class="btn-primary" onclick="openProductForm()">
                    <i class="fas fa-plus"></i> Novo Produto
                </button>
            </div>
            
            <div class="card-panel">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th width="80">Img</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th width="100" style="text-align:right">Ações</th>
                        </tr>
                    </thead>
                    <tbody><!-- Preenchido via JS --></tbody>
                </table>
            </div>
        </section>

        <!-- ABA BANNERS -->
        <section id="tab-banners" class="tab-content">
            <div class="section-header">
                <div>
                    <h1>Banners da Home</h1>
                    <p>Gerencie os slides e a ordem de exibição.</p>
                </div>
                <button class="btn-primary" onclick="openBannerForm()">
                    <i class="fas fa-plus"></i> Novo Banner
                </button>
            </div>
            <div class="banners-grid" id="banners-list">
                <!-- Preenchido via JS -->
            </div>
        </section>

    </main>

    <!-- MODAL DE PRODUTO -->
    <div id="product-modal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <h2 id="modal-title">Editar Produto</h2>
                <button class="close-modal" onclick="closeModal('product-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="prod-id"> <!-- MongoID -->
                    
                    <div class="form-grid">
                        <div class="form-group span-2">
                            <label>Nome do Produto</label>
                            <input type="text" id="prod-name" required>
                        </div>
                        <div class="form-group">
                            <label>SKU Pai (ID Único)</label>
                            <input type="text" id="prod-customId" placeholder="ex: p001" required>
                        </div>
                        <div class="form-group">
                            <label>Categoria</label>
                            <input type="text" id="prod-category" list="cat-list" required>
                        </div>
                        <div class="form-group">
                            <label>Subcategoria</label>
                            <input type="text" id="prod-subcategory" required>
                        </div>
                        <div class="form-group">
                            <label>Preço Base (R$)</label>
                            <input type="number" step="0.01" id="prod-price" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea id="prod-desc" rows="3"></textarea>
                    </div>

                    <!-- Flags -->
                    <div class="checkbox-row">
                        <label><input type="checkbox" id="flag-featured"> Destaque</label>
                        <label><input type="checkbox" id="flag-bestseller"> Mais Vendido</label>
                        <label><input type="checkbox" id="flag-new"> Novidade</label>
                        <label><input type="checkbox" id="prod-active" checked> Ativo</label>
                    </div>

                    <!-- Imagens Gerais -->
                    <div class="complex-section">
                        <div class="section-top">
                            <h3>Imagens Gerais</h3>
                        </div>
                        <!-- Input escondido, acionado pelo label -->
                        <input type="file" id="upload-general" multiple onchange="handleGeneralUpload(this)" class="file-input">
                        <label for="upload-general" class="btn-secondary">
                            <i class="fas fa-cloud-upload-alt"></i> Adicionar Fotos
                        </label>
                        
                        <div class="image-manager-area" id="general-preview"></div>
                    </div>

                    <!-- Variantes -->
                    <div class="complex-section">
                        <div class="section-top">
                            <h3>Variantes (Estoque & Fotos)</h3>
                            <button type="button" class="btn-small" onclick="addVariantEntry()">+ Adicionar</button>
                        </div>
                        <div id="variants-list-container" class="scrollable-list"></div>
                    </div>

                    <!-- Cores -->
                    <div class="complex-section">
                        <div class="section-top">
                            <h3>Cores (Filtro Visual)</h3>
                            <button type="button" class="btn-small" onclick="addColorEntry()">+ Adicionar</button>
                        </div>
                        <div id="colors-list-container" class="scrollable-list"></div>
                        <input type="hidden" id="prod-models">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-cancel" onclick="closeModal('product-modal')">Cancelar</button>
                        <button type="submit" class="btn-save">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL DE BANNER -->
    <div id="banner-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Banner</h2>
                <button class="close-modal" onclick="closeModal('banner-modal')">&times;</button>
            </div>
            <form id="banner-form">
                <input type="hidden" id="banner-id">
                <div class="form-group">
                    <label>Imagem do Banner</label>
                    <div id="banner-preview" class="image-manager-area"></div>
                    
                    <div style="margin-top:10px">
                        <input type="file" id="upload-banner" onchange="handleImageUpload(this, 'banner-preview', true)" class="file-input">
                        <label for="upload-banner" class="btn-secondary">
                            <i class="fas fa-image"></i> Escolher Imagem
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Link de Destino</label>
                    <input type="text" id="banner-link" placeholder="/collections.html">
                </div>
                <input type="hidden" id="banner-order" value="0">
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal('banner-modal')">Cancelar</button>
                    <button type="submit" class="btn-save">Salvar Banner</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sugestões de Categoria -->
    <datalist id="cat-list">
        <option value="Capas">
        <option value="Películas">
        <option value="Carregadores">
        <option value="Acessórios">
    </datalist>

    <script src="./admin.js"></script>
</body>
</html>
