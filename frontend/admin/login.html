<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - FCaseStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <!-- Link para o novo CSS -->
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="login-card">
        <h1>FCase Admin</h1>
        <p class="subtitle">Faça login para gerenciar a loja</p>
        
        <div id="error-box" class="error-box"></div>
        
        <form id="login-form">
            <div class="group">
                <label for="username">Usuário</label>
                <input type="text" id="username" required>
            </div>
            <div class="group">
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="btn-login">Entrar</button>
        </form>
    </div>

    <script>
        const API_URL = "/api";

        // Redireciona se já estiver logado
        if(localStorage.getItem('token')) window.location.href = 'admin.html';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errBox = document.getElementById('error-box');
            
            btn.innerHTML = "Autenticando...";
            btn.disabled = true;
            errBox.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'admin.html';
                } else {
                    // Aqui ele captura erros 400/401/500
                    throw new Error(data.message || "Erro no login");
                }
            } catch (error) {
                // Se der erro 500 (JWT Secret missing), vai cair aqui
                console.error(error);
                errBox.innerText = error.message;
                errBox.style.display = 'block';
                btn.innerHTML = "Entrar";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
